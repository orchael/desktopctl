---
- name: Install ai-desktops toolchain on novnc-desktop base AMI
  hosts: all
  become: true

  vars:
    # go_version, uv_version, and ai_agent_bridge_version must be injected via --extra-vars
    # from packer (variables.pkrvars.hcl). The playbook will fail if any are missing.
    ansible_python_interpreter: auto_silent
    # Minimum acceptable versions for apt-installed packages.
    min_versions:
      ansible: "2.10"
      docker.io: "24.0"
      certbot: "1.21"
      python3-certbot-dns-route53: "1.0"
      gh: "2.0"
      wireguard-tools: "1.0"
      ai-agent-bridge: "{{ ai_agent_bridge_version | regex_replace('^v', '') }}"

  pre_tasks:
    - name: Require go_version
      ansible.builtin.assert:
        that: go_version is defined and go_version | length > 0
        fail_msg: "go_version must be set via --extra-vars (defined in packer/variables.pkrvars.hcl)"

    - name: Require uv_version
      ansible.builtin.assert:
        that: uv_version is defined and uv_version | length > 0
        fail_msg: "uv_version must be set via --extra-vars (defined in packer/variables.pkrvars.hcl)"

    - name: Require ai_agent_bridge_version
      ansible.builtin.assert:
        that: ai_agent_bridge_version is defined and ai_agent_bridge_version | length > 0
        fail_msg: "ai_agent_bridge_version must be set via --extra-vars (defined in packer/variables.pkrvars.hcl)"

  tasks:
    - name: Wait for unattended-upgrades to release the dpkg lock
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          sleep 5
        done
      changed_when: false
      timeout: 300

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # ansible is needed for cloud-init's ansible-playbook desktop-setup run.
    # python3-certbot-dns-route53 is not in the novnc-desktop elementary AMI.
    - name: Install ansible, certbot Route53 plugin, WireGuard tools, and ACL support
      ansible.builtin.apt:
        name:
          - ansible
          - python3-certbot-dns-route53
          - wireguard-tools
          - acl
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Install Go
      ansible.builtin.shell: |
        curl -fsSL https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz | \
          tar -xzf - -C /usr/local/
        echo 'export PATH=$PATH:/usr/local/go/bin' > /etc/profile.d/golang.sh
      args:
        creates: /usr/local/go/bin/go

    - name: Install uv (Python package manager) at pinned version
      ansible.builtin.shell: |
        curl -LsSf "https://github.com/astral-sh/uv/releases/download/{{ uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz" \
          | tar -xzf - -C /tmp/
        install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
        rm -rf /tmp/uv-x86_64-unknown-linux-gnu
      args:
        creates: /usr/local/bin/uv

    - name: Install AWS CLI v2
      ansible.builtin.shell: |
        curl -fsSL 'https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip' -o '/tmp/awscliv2.zip'
        unzip -q /tmp/awscliv2.zip -d /tmp
        /tmp/aws/install
        rm -rf /tmp/awscliv2.zip /tmp/aws
      args:
        creates: /usr/local/bin/aws

    - name: Install neovim via snap
      community.general.snap:
        name: nvim
        classic: true
        state: present

    - name: Install Homebrew for Linux
      ansible.builtin.shell: |
        NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      args:
        creates: /home/linuxbrew/.linuxbrew/bin/brew
      become: false

    - name: Add Homebrew to PATH via /etc/profile.d
      ansible.builtin.copy:
        dest: /etc/profile.d/homebrew.sh
        owner: root
        group: root
        mode: "0644"
        content: |
          if [ -d /home/linuxbrew/.linuxbrew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi

    - name: Get latest nvm release version
      ansible.builtin.uri:
        url: https://api.github.com/repos/nvm-sh/nvm/releases/latest
        method: GET
        return_content: true
        headers:
          Accept: application/vnd.github.v3+json
      register: nvm_latest_release
      changed_when: false

    - name: Install nvm for ubuntu user
      ansible.builtin.shell: |
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/{{ nvm_latest_release.json.tag_name }}/install.sh | bash
      args:
        creates: /home/ubuntu/.nvm/nvm.sh
      become: false

    - name: Add nvm to login shell PATH via /etc/profile.d
      ansible.builtin.copy:
        dest: /etc/profile.d/nvm.sh
        owner: root
        group: root
        mode: "0644"
        content: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          [ -s "$NVM_DIR/bash_completion" ] && . "$NVM_DIR/bash_completion"

    - name: Install Rust via rustup for ubuntu user
      ansible.builtin.shell: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
      args:
        creates: /home/ubuntu/.cargo/bin/rustc
      become: false

    - name: Add Cargo to login shell PATH via /etc/profile.d
      ansible.builtin.copy:
        dest: /etc/profile.d/rust.sh
        owner: root
        group: root
        mode: "0644"
        content: |
          if [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi

    - name: Add GitHub CLI apt repository
      ansible.builtin.shell: |
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
          | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg 2>/dev/null
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
          | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
        apt-get update -qq
      args:
        creates: /etc/apt/sources.list.d/github-cli.list

    - name: Install GitHub CLI and python3
      ansible.builtin.apt:
        name:
          - gh
          - python3
        state: present

    - name: Add NodeSource Node.js 24 apt repository
      ansible.builtin.shell: |
        set -eo pipefail
        curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
      args:
        executable: /bin/bash

    - name: Install Node.js 24
      ansible.builtin.apt:
        name: nodejs
        state: latest
        update_cache: true

    - name: Check ai-agent-bridge apt keyring is reachable
      ansible.builtin.uri:
        url: https://markcallen.github.io/ai-agent-bridge/apt/ai-agent-bridge-archive-keyring.asc
        method: GET
        status_code: 200
      changed_when: false

    - name: Get Debian package architecture
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Add ai-agent-bridge apt repository key
      ansible.builtin.shell: |
        curl -fsSL https://markcallen.github.io/ai-agent-bridge/apt/ai-agent-bridge-archive-keyring.asc \
          | gpg --dearmor -o /etc/apt/keyrings/ai-agent-bridge.gpg
      args:
        creates: /etc/apt/keyrings/ai-agent-bridge.gpg

    - name: Add ai-agent-bridge apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/ai-agent-bridge.gpg] https://markcallen.github.io/ai-agent-bridge/apt {{ ansible_distribution_release }} main"
        state: present
        filename: ai-agent-bridge

    - name: Install ai-agent-bridge at pinned version
      ansible.builtin.apt:
        name: "ai-agent-bridge={{ ai_agent_bridge_version | regex_replace('^v', '') }}"
        state: present
        update_cache: true

    - name: Run install-provider-runtime to install Claude and other provider CLIs
      ansible.builtin.command: /usr/lib/ai-agent-bridge/install-provider-runtime
      args:
        creates: /opt/ai-agent-bridge/node_modules/.bin/claude

    - name: Install ai-desktops bridge config (adds /workspace to allowed_paths)
      ansible.builtin.copy:
        dest: /etc/ai-agent-bridge/bridge.yaml
        owner: root
        group: root
        mode: "0644"
        content: |
          server:
            listen: "127.0.0.1:9445"

          tls:
            ca_bundle: ""
            cert: ""
            key: ""

          auth:
            jwt_public_keys: []
            jwt_audience: "bridge"
            jwt_max_ttl: "5m"

          feature_flags:
            provider_fallbacks: true

          sessions:
            max_per_project: 5
            max_global: 20
            idle_timeout: "30m"
            stop_grace_period: "10s"
            event_buffer_size: 10000
            max_subscribers_per_session: 10
            subscriber_ttl: "30m"

          input:
            max_size_bytes: 65536

          rate_limits:
            global_rps: 50
            global_burst: 100
            start_session_per_client_rps: 1
            start_session_per_client_burst: 3
            send_input_per_session_rps: 5
            send_input_per_session_burst: 20

          persistence:
            db_path: "/home/bridge/sessions.db"

          runtime:
            provider_root: "/opt/ai-agent-bridge"

          providers:
            claude:
              binary: "/opt/ai-agent-bridge/node_modules/@anthropic-ai/claude-code/bin/claude.exe"
              args: []
              startup_timeout: "60s"
              startup_probe: "output"
              required_env: ["CLAUDE_CODE_OAUTH_TOKEN"]
              prompt_pattern: '(?m)(❯|>\s*$)'
            codex:
              binary: "/usr/bin/node"
              args: ["/opt/ai-agent-bridge/node_modules/@openai/codex/bin/codex.js"]
              startup_timeout: "60s"
              startup_probe: "output"
              required_env: ["OPENAI_API_KEY"]
              prompt_pattern: '(?m)(❯|>\s*$)'

          allowed_paths:
            - "/home"
            - "/workspace"

          logging:
            level: "info"
            format: "json"
            redact_patterns:
              - '(?i)(api[_-]?key|token|secret|password)\s*[:=]\s*\S+'

    - name: Create ai-agent-bridge systemd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/ai-agent-bridge.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install ai-desktops systemd drop-in (ReadWritePaths + EnvironmentFile)
      ansible.builtin.copy:
        dest: /etc/systemd/system/ai-agent-bridge.service.d/ai-desktops.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          EnvironmentFile=-/etc/ai-agent-bridge/agents.env
          ReadWritePaths=/home/bridge /workspace /tmp /var/tmp

    - name: Reload systemd after drop-in install
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Create ai-desktops system user for the web API server
      ansible.builtin.user:
        name: ai-desktops
        system: true
        shell: /usr/sbin/nologin
        home: /opt/ai-desktops
        create_home: false
        comment: ai-desktops web API server

    - name: Create desktop group for shared /workspace access
      ansible.builtin.group:
        name: desktop
        state: present

    - name: Add ubuntu to desktop group
      ansible.builtin.user:
        name: ubuntu
        groups: desktop
        append: true

    - name: Add bridge to desktop group
      ansible.builtin.user:
        name: bridge
        groups: desktop
        append: true

    - name: Add bridge to docker group
      ansible.builtin.user:
        name: bridge
        groups: docker
        append: true

    - name: Move bridge user home directory to /home/bridge
      ansible.builtin.shell: |
        usermod --home /home/bridge --move-home bridge
      args:
        creates: /home/bridge
      register: bridge_home_move

    - name: Ensure /home/bridge has correct ownership and permissions
      ansible.builtin.file:
        path: /home/bridge
        state: directory
        owner: bridge
        group: bridge
        mode: "0750"

    - name: Create /workspace directory owned by bridge
      ansible.builtin.file:
        path: /workspace
        state: directory
        owner: bridge
        group: desktop
        mode: "0755"

    - name: Set default ACL on /workspace so desktop group members can read new files
      ansible.builtin.shell: |
        setfacl -d -m g:desktop:rX /workspace
        setfacl -m g:desktop:rX /workspace
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install ai-desktops-setup-tls wrapper script
      ansible.builtin.copy:
        src: files/ai-desktops-setup-tls
        dest: /usr/local/bin/ai-desktops-setup-tls
        owner: root
        group: root
        mode: "0755"

    - name: Install ai-desktops-doctor script
      ansible.builtin.copy:
        src: files/ai-desktops-doctor
        dest: /usr/local/bin/ai-desktops-doctor
        owner: root
        group: root
        mode: "0755"

    - name: Install pnpm globally via corepack
      ansible.builtin.shell: |
        corepack enable
        corepack prepare pnpm@10 --activate
      args:
        creates: /usr/local/bin/pnpm

    - name: Create /opt/ai-desktops/web directory
      ansible.builtin.file:
        path: /opt/ai-desktops/web
        state: directory
        owner: ai-desktops
        group: ai-desktops
        mode: "0755"

    - name: Install desktop-web dist into /opt/ai-desktops/web/dist
      ansible.builtin.copy:
        src: /tmp/desktop-web-dist/
        dest: /opt/ai-desktops/web/dist/
        remote_src: true
        owner: ai-desktops
        group: ai-desktops

    - name: Install api-server.py into /opt/ai-desktops/web
      ansible.builtin.copy:
        src: /tmp/desktop-web-api-server.py
        dest: /opt/ai-desktops/web/api-server.py
        remote_src: true
        owner: ai-desktops
        group: ai-desktops
        mode: "0755"

    - name: Remove temporary desktop-web dist upload
      ansible.builtin.file:
        path: /tmp/desktop-web-dist
        state: absent

    - name: Remove temporary desktop-web api-server upload
      ansible.builtin.file:
        path: /tmp/desktop-web-api-server.py
        state: absent

    - name: Install ai-desktops-web systemd service
      ansible.builtin.copy:
        src: files/ai-desktops-web.service
        dest: /etc/systemd/system/ai-desktops-web.service
        owner: root
        group: root
        mode: "0644"

    - name: Enable ai-desktops-web service
      ansible.builtin.systemd:
        name: ai-desktops-web
        enabled: true
        daemon_reload: true

    - name: Collect installed package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Warn if apt package versions are below minimum
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ item.key }} installed version
          {{ ansible_facts.packages[item.key][0].version | default('unknown') }}
          is below minimum {{ item.value }}
      when:
        - ansible_facts.packages[item.key] is defined
        - (ansible_facts.packages[item.key][0].version | default('0')) is version(item.value, '<')
      loop: "{{ min_versions | dict2items }}"

    - name: Fail if required apt packages are missing
      ansible.builtin.fail:
        msg: "Required package {{ item.key }} is not installed"
      when: ansible_facts.packages[item.key] is not defined
      loop: "{{ min_versions | dict2items }}"

    - name: Verify Go version
      ansible.builtin.command: /usr/local/go/bin/go version
      register: go_ver_out
      changed_when: false

    - name: Warn if Go version does not match expected
      ansible.builtin.debug:
        msg: >-
          WARNING: Go version mismatch — expected go{{ go_version }},
          got {{ go_ver_out.stdout }}
      when: "'go' + go_version not in go_ver_out.stdout"

    - name: Verify uv is installed
      ansible.builtin.command: /usr/local/bin/uv --version
      register: uv_ver_out
      changed_when: false

    - name: Warn if uv version does not match expected
      ansible.builtin.debug:
        msg: >-
          WARNING: uv version mismatch — expected {{ uv_version }},
          got {{ uv_ver_out.stdout }}
      when: "uv_version not in uv_ver_out.stdout"

    - name: Verify ai-agent-bridge is installed
      ansible.builtin.command: dpkg-query -W -f='${Version}' ai-agent-bridge
      register: bridge_ver_out
      changed_when: false

    - name: Warn if ai-agent-bridge version does not match expected
      ansible.builtin.debug:
        msg: >-
          WARNING: ai-agent-bridge version mismatch — expected {{ ai_agent_bridge_version }},
          got {{ bridge_ver_out.stdout }}
      when: "(ai_agent_bridge_version | regex_replace('^v', '')) not in bridge_ver_out.stdout"

    - name: Verify Node.js 24 is installed
      ansible.builtin.command: node --version
      register: node_ver_out
      changed_when: false

    - name: Warn if Node.js major version is not 24
      ansible.builtin.debug:
        msg: "WARNING: Node.js version is {{ node_ver_out.stdout }}, expected v24.x"
      when: "not node_ver_out.stdout.startswith('v24.')"

    - name: Verify claude CLI is installed by install-provider-runtime
      ansible.builtin.stat:
        path: /opt/ai-agent-bridge/node_modules/.bin/claude
      register: claude_bin

    - name: Fail if claude CLI is missing after install-provider-runtime
      ansible.builtin.fail:
        msg: "claude CLI not found at /opt/ai-agent-bridge/node_modules/.bin/claude — install-provider-runtime may have failed"
      when: not claude_bin.stat.exists

    - name: Verify nvm is installed
      ansible.builtin.shell: |
        bash -c 'source /home/ubuntu/.nvm/nvm.sh && nvm --version'
      register: nvm_ver_out
      changed_when: false
      become: false

    - name: Show nvm version
      ansible.builtin.debug:
        msg: "nvm version: {{ nvm_ver_out.stdout }}"

    - name: Verify rustc is installed
      ansible.builtin.command: /home/ubuntu/.cargo/bin/rustc --version
      register: rust_ver_out
      changed_when: false
      become: false

    - name: Show Rust version
      ansible.builtin.debug:
        msg: "Rust version: {{ rust_ver_out.stdout }}"

    - name: Re-enable unattended-upgrades timers so launched instances get security updates
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
        - unattended-upgrades.service

    - name: Clean up apt cache
      ansible.builtin.apt:
        autoclean: true
        autoremove: true
