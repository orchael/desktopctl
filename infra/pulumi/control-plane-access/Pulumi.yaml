name: control-plane-access
runtime: go
description: desktopctl DOKS control plane IAM user and assumable AWS role

config:
  aws:region:
    value: us-east-1
  environment:
    default: dev
  roleName:
    default: ""
  bootstrapUserName:
    default: ""
  secretPrefix:
    default: /desktopctl/
  externalId:
    secret: true
