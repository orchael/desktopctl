apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-desktops-control-plane
  namespace: ai-desktops
data:
  AI_DESKTOPS_ENVIRONMENT: dev
  AWS_REGION: us-east-2
  CONTROL_PLANE_ADDR: :8080
  CONTROL_PLANE_STATIC_DIR: /app/static
  config.yaml: |
    aws:
      region: us-east-2
    pulumi:
      backend_bucket: replace-me
      infra_dir: /app
    fleet:
      table_name: ai-desktops-fleet-dev
      ami_table_name: ai-desktops-ami-dev
      environment: dev
    github:
      owner: replace-me
    desktop:
      operator_cidr: 203.0.113.10/32
    agent:
      bridge_port: 9445
