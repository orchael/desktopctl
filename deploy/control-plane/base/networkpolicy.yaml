apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-desktops-control-plane
  namespace: ai-desktops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-desktops-control-plane
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - {}
