{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "control-plane.secretName" . }}
  labels: {{- include "control-plane.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  MIGRATION_DATABASE_URL: {{ required "secrets.migrationDatabaseUrl is required" .Values.secrets.migrationDatabaseUrl | quote }}
  AUTH_SECRET: {{ required "secrets.authSecret is required" .Values.secrets.authSecret | quote }}
  GOOGLE_CLIENT_ID: {{ required "secrets.googleClientId is required" .Values.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ required "secrets.googleClientSecret is required" .Values.secrets.googleClientSecret | quote }}
  CONTROL_PLANE_API_TOKEN: {{ required "secrets.controlPlaneApiToken is required" .Values.secrets.controlPlaneApiToken | quote }}
  OPERATOR_AWS_ACCESS_KEY_ID: {{ required "secrets.operatorAwsAccessKeyId is required" .Values.secrets.operatorAwsAccessKeyId | quote }}
  OPERATOR_AWS_SECRET_ACCESS_KEY: {{ required "secrets.operatorAwsSecretAccessKey is required" .Values.secrets.operatorAwsSecretAccessKey | quote }}
  OPERATOR_EXTERNAL_ID: {{ required "secrets.operatorExternalId is required" .Values.secrets.operatorExternalId | quote }}
{{- end }}
