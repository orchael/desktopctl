apiVersion: v1
kind: Service
metadata: {name: {{ include "control-plane.name" . }}-web}
spec:
  selector: {app.kubernetes.io/component: web, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "control-plane.name" . }}-api}
spec:
  selector: {app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: {{ .Values.api.port }}, targetPort: http}]
