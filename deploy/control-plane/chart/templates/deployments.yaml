apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "control-plane.name" . }}-web
  labels: {{- include "control-plane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector: {matchLabels: {app.kubernetes.io/component: web, app.kubernetes.io/instance: {{ .Release.Name }}}}
  template:
    metadata: {labels: {app.kubernetes.io/component: web, app.kubernetes.io/instance: {{ .Release.Name }}}}
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: {{ .Values.web.port }}}]
          env:
            - {name: AUTH_TRUST_HOST, value: "true"}
            - {name: CONTROL_PLANE_API_URL, value: "http://{{ include "control-plane.name" . }}-api:{{ .Values.api.port }}"}
            {{- range $name := list "DATABASE_URL" "AUTH_SECRET" "GOOGLE_CLIENT_ID" "GOOGLE_CLIENT_SECRET" "CONTROL_PLANE_API_TOKEN" }}
            - name: {{ $name }}
              valueFrom: {secretKeyRef: {name: {{ include "control-plane.secretName" $ }}, key: {{ $name }}}}
            {{- end }}
          readinessProbe: {httpGet: {path: /signin, port: http}, initialDelaySeconds: 5}
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "control-plane.name" . }}-api
  labels: {{- include "control-plane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector: {matchLabels: {app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }}}}
  template:
    metadata: {labels: {app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }}}}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}-api"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: {{ .Values.api.port }}}]
          env:
            - {name: AWS_REGION, value: {{ .Values.config.awsRegion | quote }}}
            - {name: AI_DESKTOPS_ENVIRONMENT, value: {{ .Values.config.environment | quote }}}
            - {name: AWS_ROLE_ARN, value: {{ .Values.config.awsRoleArn | quote }}}
            - {name: AWS_EXTERNAL_ID, value: {{ .Values.config.awsExternalId | quote }}}
            - name: CONTROL_PLANE_API_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "control-plane.secretName" . }}, key: CONTROL_PLANE_API_TOKEN}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: {{ include "control-plane.secretName" . }}, key: AWS_ACCESS_KEY_ID, optional: true}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ include "control-plane.secretName" . }}, key: AWS_SECRET_ACCESS_KEY, optional: true}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5}
          resources: {{- toYaml .Values.resources | nindent 12 }}
