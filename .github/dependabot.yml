version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /apps/desktop-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      aws-sdk:
        patterns:
          - aws-sdk
          - '@aws-sdk/*'
      testing:
        patterns:
          - vitest
          - '@vitest/*'
      dev-tooling:
        dependency-type: development
        patterns:
          - eslint*
          - prettier
          - typescript-eslint
          - '@eslint/*'
          - globals

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
