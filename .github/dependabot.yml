version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns:
          - github.com/aws/*

  - package-ecosystem: npm
    directory: /apps/desktop-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Keep @types/node locked to v25 to match Node.js LTS version.
      # Upgrade to the next major version when Node.js is upgraded in .nvmrc
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      aws-sdk:
        patterns:
          - aws-sdk
          - '@aws-sdk/*'
      testing:
        patterns:
          - vitest
          - '@vitest/*'
      dev-tooling:
        dependency-type: development
        patterns:
          - eslint*
          - prettier
          - typescript-eslint
          - '@eslint/*'
          - globals

  - package-ecosystem: npm
    directory: /apps/control-plane-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      testing:
        patterns:
          - vitest
          - '@vitest/*'
      dev-tooling:
        dependency-type: development
        patterns:
          - eslint*
          - prettier
          - typescript-eslint
          - '@eslint/*'
          - globals

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
