name: Lint

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-ansible:
    name: Ansible lint and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Ansible lint and Packer collections
        run: |
          python -m pip install ansible-lint==26.6.0
          ansible-galaxy collection install -r packer/requirements.yml

      - name: Check Packer Ansible playbook
        run: |
          ansible-playbook --syntax-check -i localhost, packer/playbook.yml
          ansible-lint --offline packer/playbook.yml

  lint-go:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  lint-web:
    name: ESLint (desktop-web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop-web
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/desktop-web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/desktop-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Prettier check
        run: pnpm run prettier

  lint-control-plane-web:
    name: ESLint (control-plane-web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane-web
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/control-plane-web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/control-plane-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Prettier check
        run: pnpm run prettier
