name: Publish Desktop Web

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options: [patch, minor, major]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump_and_tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev_tag
        uses: WyriHaximus/github-action-get-previous-tag@v2
        with:
          prefix: desktop-web-v

      - name: Compute next versions
        id: next_semver
        uses: WyriHaximus/github-action-next-semvers@v1
        with:
          version: ${{ steps.prev_tag.outputs.tag }}

      - name: Select version
        id: semver
        run: |
          case "${{ inputs.release_type }}" in
            patch) echo "version=${{ steps.next_semver.outputs.patch }}" >> "$GITHUB_OUTPUT" ;;
            minor) echo "version=${{ steps.next_semver.outputs.minor }}" >> "$GITHUB_OUTPUT" ;;
            major) echo "version=${{ steps.next_semver.outputs.major }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/desktop-web/pnpm-lock.yaml

      - name: Bump package.json version
        run: |
          cd apps/desktop-web
          pnpm install --frozen-lockfile
          npm version ${{ steps.semver.outputs.version }} --no-git-tag-version

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/desktop-web/package.json
          git commit -m "chore(desktop-web): bump version to ${{ steps.semver.outputs.version }} [skip ci]" || echo "Nothing to commit"
          git tag "desktop-web-v${{ steps.semver.outputs.version }}"
          git push origin HEAD --tags

  publish:
    needs: bump_and_tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-web-v${{ needs.bump_and_tag.outputs.version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          cache: pnpm
          cache-dependency-path: apps/desktop-web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd apps/desktop-web
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          cd apps/desktop-web
          pnpm run build

      - name: Run tests
        run: |
          cd apps/desktop-web
          pnpm run test

      - name: Publish to GitHub Packages
        run: |
          cd apps/desktop-web
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
