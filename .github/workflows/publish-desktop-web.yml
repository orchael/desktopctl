name: Publish Desktop Web

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ inputs.version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: apps/desktop-web/.nvmrc
          registry-url: https://npm.pkg.github.com
          cache: pnpm
          cache-dependency-path: apps/desktop-web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd apps/desktop-web
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          cd apps/desktop-web
          pnpm run build

      - name: Run tests
        run: |
          cd apps/desktop-web
          pnpm run test

      - name: Publish to GitHub Packages
        run: |
          cd apps/desktop-web
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
