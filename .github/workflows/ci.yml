name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run tests with coverage
        # Exclude awsx (pure AWS SDK wrappers) and cmd (entrypoints) from the threshold;
        # those require integration tests against real AWS.
        run: |
          go test -coverprofile=coverage.out \
            $(go list ./... | grep 'internal' | grep -v '/awsx')

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Internal package coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 60" | bc -l)" -eq 1 ]; then
            echo "Coverage ${COVERAGE}% is below 60% threshold"
            exit 1
          fi

  pulumi:
    name: Pulumi module (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [foundation, desktop, control-plane-access]
    defaults:
      run:
        working-directory: infra/pulumi/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: infra/pulumi/${{ matrix.module }}/go.mod
          cache-dependency-path: infra/pulumi/${{ matrix.module }}/go.sum
      - run: go test ./...

  web:
    name: Desktop web build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop-web
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/desktop-web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/desktop-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests
        run: pnpm run test:smoke

  control-plane-web:
    name: Control plane web build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane-web
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/control-plane-web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/control-plane-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Run tests with coverage
        run: pnpm run test:coverage

  control-plane-container:
    name: Companion app container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and start companion
        run: docker compose -f docker-compose.yml up --build --detach --wait

      - name: Smoke private browser and fleet API
        run: |
          curl -fsS http://127.0.0.1:3000/ | grep -q 'desktopctl'
          curl -fsS http://127.0.0.1:3000/api/fleet/desktops | grep -q 'd-demo001'
          created=$(curl -fsS -X POST -H 'Origin: http://127.0.0.1:3000' \
            -H 'Content-Type: application/json' -d '{"owner":"orchael","name":"smoke"}' \
            http://127.0.0.1:3000/api/fleet/desktops)
          job_id=$(jq -r .id <<< "$created")
          desktop_id=$(jq -r .desktop_id <<< "$created")
          test -n "$job_id" && test -n "$desktop_id"
          for i in {1..30}; do
            state=$(curl -fsS "http://127.0.0.1:3000/api/fleet/jobs/$job_id" | jq -r .state)
            if [ "$state" = succeeded ]; then break; fi
            if [ "$state" = failed ]; then exit 1; fi
            sleep 1
          done
          test "$state" = succeeded
          curl -fsS http://127.0.0.1:3000/api/fleet/desktops | grep -q "$desktop_id"
          terminated=$(curl -fsS -X POST -H 'Origin: http://127.0.0.1:3000' \
            -H 'Content-Type: application/json' -d "{\"confirm\":\"$desktop_id\"}" \
            "http://127.0.0.1:3000/api/fleet/desktops/$desktop_id/terminate")
          job_id=$(jq -r .id <<< "$terminated")
          for i in {1..30}; do
            state=$(curl -fsS "http://127.0.0.1:3000/api/fleet/jobs/$job_id" | jq -r .state)
            if [ "$state" = succeeded ]; then break; fi
            if [ "$state" = failed ]; then exit 1; fi
            sleep 1
          done
          test "$state" = succeeded

      - name: Stop companion
        if: always()
        run: docker compose -f docker-compose.yml down
