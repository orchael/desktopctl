name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        type: choice
        options: [patch, minor, major]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump_and_tag:
    name: Bump version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev_tag
        uses: WyriHaximus/github-action-get-previous-tag@v2

      - name: Compute next versions
        id: next_semver
        uses: WyriHaximus/github-action-next-semvers@v1
        with:
          version: ${{ steps.prev_tag.outputs.tag }}

      - name: Select version
        id: semver
        run: |
          case "${{ inputs.release_type }}" in
            patch) echo "version=${{ steps.next_semver.outputs.patch }}" >> "$GITHUB_OUTPUT" ;;
            minor) echo "version=${{ steps.next_semver.outputs.minor }}" >> "$GITHUB_OUTPUT" ;;
            major) echo "version=${{ steps.next_semver.outputs.major }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Update version file and tag
        run: |
          sed -i 's/var Version = "[^"]*"/var Version = "${{ steps.semver.outputs.version }}"/' internal/version/version.go
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add internal/version/version.go
          git commit -m "chore(release): bump version to ${{ steps.semver.outputs.version }} [skip ci]" || echo "Nothing to commit"
          git tag "v${{ steps.semver.outputs.version }}"
          git push origin HEAD --tags

  publish:
    name: Publish with GoReleaser
    needs: bump_and_tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.bump_and_tag.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify build
        run: go build -o /tmp/ai-desktops-verify ./cmd/ai-desktops

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.14.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
