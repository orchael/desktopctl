name: Publish Control Plane

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-desktops-control-plane
          tags: |
            type=ref,event=tag
            type=sha

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.control-plane
          target: web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and publish API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.control-plane
          target: api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-desktops-control-plane:${{ github.ref_name }}-api
            ghcr.io/${{ github.repository_owner }}/ai-desktops-control-plane:sha-${{ github.sha }}-api
