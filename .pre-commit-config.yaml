repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        stages: [pre-commit]
      - id: go-vet
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: go-test
        name: Go tests
        entry: go test ./...
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: web-build-test
        name: Desktop web build and test
        entry: bash -c 'cd apps/desktop-web && pnpm run build && pnpm run test'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: eslint
        name: ESLint (desktop-web)
        entry: bash -c 'cd apps/desktop-web && pnpm run lint'
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: \.(ts|tsx|js|mjs)$
