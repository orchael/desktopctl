version: 2

project_name: desktopctl

release:
  name_template: "desktopctl v{{ .Version }}"

builds:
  - id: desktopctl
    binary: desktopctl
    main: ./cmd/desktopctl
    ldflags:
      - -s -w -X github.com/orchael/desktopctl/internal/version.Version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: desktopctl
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: desktopctl-checksums.txt

brews:
  - name: desktopctl
    ids:
      - desktopctl
    homepage: https://github.com/orchael/desktopctl
    description: Manage persistent AI coding desktops on AWS
    license: MIT
    repository:
      owner: orchael
      name: homebrew-desktopctl
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    directory: Formula
    test: |
      system "#{bin}/desktopctl", "version"
