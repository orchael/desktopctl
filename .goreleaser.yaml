version: 2

project_name: ai-desktops

release:
  name_template: "ai-desktops v{{ .Version }}"

builds:
  - id: ai-desktops
    binary: ai-desktops
    main: ./cmd/ai-desktops
    ldflags:
      - -s -w -X github.com/orchael/ai-desktops/internal/version.Version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: ai-desktops
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: ai-desktops-checksums.txt
