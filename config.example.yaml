# ai-desktops example configuration
# Copy to ~/.ai-desktops/config.yaml and fill in your values.
# Do NOT commit files containing real secrets or personal values.

aws:
  # AWS region where desktops will be provisioned
  region: us-east-1

  # AWS CLI profile to use (matches a profile in ~/.aws/credentials or ~/.aws/config)
  profile: myprofile

pulumi:
  # S3 bucket name for Pulumi state storage.
  # Created by `ai-desktops bootstrap`; must be globally unique.
  backend_bucket: myorg-ai-desktops-pulumi-state

  # Path to the repository root containing infra/pulumi/foundation and
  # infra/pulumi/desktop. Defaults to "." (current working directory).
  # Set to an absolute path if running the CLI from outside the repo root.
  # infra_dir: /home/user/ai-desktops

fleet:
  # DynamoDB table name for fleet metadata.
  # Created by `ai-desktops bootstrap`.
  table_name: ai-desktops-fleet-dev

  # Default control-plane organization UUID for new desktop records and
  # organization-scoped list output. Can be overridden with --organization-id.
  # organization_id: 00000000-0000-4000-8000-000000000001

  # Environment tag. Affects DNS zone selection:
  #   prod  → desktops.orchael.com
  #   dev   → desktops.orchael.dev (default)
  environment: dev

github:
  # GitHub organization or user that owns all repos cloned onto desktops.
  # Repos with a different owner are rejected at create time.
  # If set here, --github-owner can be omitted from `create`.
  owner: myorg

  # AWS Secrets Manager secret path for this GitHub owner's credentials.
  # Created automatically by `ai-desktops setup`. Contains github_token,
  # ssh_private_key, and ssh_public_key as a JSON document.
  github_secret: /ai-desktops/myorg/github

  # Git commit identity written to the desktop's global git config.
  # Used as the author name and email for all commits made on the desktop.
  git_user_name: Your Name
  git_user_email: you@example.com

  # Optional npm scopes that should resolve from GitHub Packages on provisioned
  # desktops. Leave empty so scoped packages use npmjs by default. Values may
  # be written with or without the leading "@".
  # npm_github_scopes:
  #   - private-tools

operator:
  # AWS Secrets Manager path for operator-only credentials used by the
  # ai-desktops CLI, not injected into desktop environments.
  # Created/updated automatically when an operator env var such as
  # TAILSCALE_API_KEY is present during relevant commands.
  # Default: /ai-desktops/<github.owner>
  secret: /ai-desktops/myorg

desktop:
  # EC2 instance type for each desktop.
  # t3.xlarge (4 vCPU / 16 GiB) is a reasonable starting point.
  instance_type: t3.xlarge

  # Root EBS volume size in GiB. Leave unset (or set to 0) to use context-sensitive defaults:
  #   64 GiB for normal desktops, 200 GiB for mobile/AVD desktops.
  # Setting a value here forces that size for all desktops, disabling the automatic mobile/AVD default.
  # volume_size: 0

  # Pre-baked AMI IDs per region, populated automatically by `ai-desktops ami build`.
  # When present, desktop creation uses these AMIs instead of the default Ubuntu map,
  # and cloud-init skips package installation (tools are already baked in).
  # Run `ai-desktops ami list` to see current values.
  # active_ami:
  #   us-east-1: ami-0123456789abcdef0
  #   us-east-2: ami-0123456789abcdef1
  #   us-west-2: ami-0123456789abcdef2

  # Android Virtual Devices to create at desktop boot.
  # Each entry defines an AVD that avdmanager will create for the ubuntu user.
  # The AMI must have the Android SDK and the requested system-image pre-installed.
  # CLI flag --avd overrides this list entirely (it does not append).
  # avds:
  #   - name: flutter_dev
  #     image: "system-images;android-35;google_apis;x86_64"
  #     device: pixel_6   # optional hardware profile; omit for avdmanager default
  #   - name: pixel_7_phone
  #     image: "system-images;android-34;google_apis_playstore;x86_64"
  #     device: pixel_7
  #   - name: pixel_tablet
  #     image: "system-images;android-34;google_apis_playstore;x86_64"
  #     device: pixel_tablet

  # CIDR range from which SSH (port 22) is allowed in the security group.
  # Defaults to 0.0.0.0/0 (open). Restrict to your IP for least-privilege access.
  operator_cidr: 0.0.0.0/0

agent:
  # Port where bridgectl listens on the desktop. Defaults to localhost-only.
  # When both Tailscale and step-ca are enabled, cloud-init binds this port to
  # the desktop's Tailscale IPv4 address for direct tailnet access.
  # Default: 9445. Change only if there is a port conflict on the desktop.
  bridge_port: 9445

  # Whether to disable SSH host key verification when tunneling to desktops.
  # Leave false (the default) for normal operation so ~/.ssh/known_hosts is
  # consulted. Set to true when connecting to freshly provisioned desktops
  # whose host key is not yet in known_hosts; can also use --trust-host flag
  # on the agent command for one-shot overrides.
  # trust_host: false

network:
  # Optional Tailscale tailnet/network default used when running create with
  # --tailscale. Requires TAILSCALE_AUTHKEY in the local environment or an
  # existing /ai-desktops/<owner>/tailscale/<tailnet> secret with TS_AUTHKEY.
  # Can be overridden per desktop with --tailscale-network, which also enables
  # Tailscale for that desktop.
  # tailscale_network: my-tailnet

pki:
  # Optional step-ca DNS name used to bootstrap trust and issue bridgectl host
  # certificates. Used when running create with --step-ca, or with --tailscale
  # when this config value is set. If the CA is reachable only over Tailscale,
  # also configure network.tailscale_network.
  # Requires STEP_CA_PROVISIONER_PASSWORD in the local environment or an existing
  # /ai-desktops/<owner>/step-ca/<server> secret with STEP_CA_PROVISIONER_PASSWORD.
  # Can be overridden per desktop with --step-ca.
  # step_ca_server: ca.my-tailnet.ts.net

  # step-ca provisioner for bridge host certificates. Default: admin.
  # Can be overridden with --step-ca-provisioner.
  # step_ca_provisioner: admin

  # Root certificate fingerprint for non-interactive private CA bootstrap.
  # Required when step-ca is enabled.
  # Can also be supplied by STEP_CA_FINGERPRINT or --step-ca-fingerprint.
  # step_ca_fingerprint: abcdef0123456789

  # Remote bridgectl clients trusted by the desktop's bridge server at startup.
  # The issuer normally matches the client's Step CA certificate common name.
  # public_key_path is read from this machine during `ai-desktops create`; only
  # the public key is copied to the desktop. You can also pass one-off clients
  # with --step-ca-client issuer=<name>,public-key-path=<path>,required=true.
  # step_ca_clients:
  #   - issuer: mark-macbook
  #     public_key_path: /Users/mark/.config/bridgectl/certs/jwt-signing.pub
  #     required: true
