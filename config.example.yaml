# ai-desktops example configuration
# Copy to ~/.ai-desktops/config.yaml and fill in your values.
# Do NOT commit files containing real secrets or personal values.

aws:
  # AWS region where desktops will be provisioned
  region: us-east-1

  # AWS CLI profile to use (matches a profile in ~/.aws/credentials or ~/.aws/config)
  profile: myprofile

pulumi:
  # S3 bucket name for Pulumi state storage.
  # Created by `ai-desktops bootstrap`; must be globally unique.
  backend_bucket: myorg-ai-desktops-pulumi-state

  # Path to the repository root containing infra/pulumi/foundation and
  # infra/pulumi/desktop. Defaults to "." (current working directory).
  # Set to an absolute path if running the CLI from outside the repo root.
  # infra_dir: /home/user/ai-desktops

fleet:
  # DynamoDB table name for fleet metadata.
  # Created by `ai-desktops bootstrap`.
  table_name: ai-desktops-fleet-dev

  # Environment tag. Affects DNS zone selection:
  #   prod  → desktops.orchael.com
  #   dev   → desktops.orchael.dev (default)
  environment: dev

github:
  # GitHub organization or user that owns all repos cloned onto desktops.
  # Repos with a different owner are rejected at create time.
  # If set here, --github-owner can be omitted from `create`.
  owner: myorg

  # AWS Secrets Manager secret path for this GitHub owner's credentials.
  # Created automatically by `ai-desktops setup`. Contains github_token,
  # ssh_private_key, and ssh_public_key as a JSON document.
  github_secret: /ai-desktops/myorg/github

  # Git commit identity written to the desktop's global git config.
  # Used as the author name and email for all commits made on the desktop.
  git_user_name: Your Name
  git_user_email: you@example.com

desktop:
  # EC2 instance type for each desktop.
  # t3.xlarge (4 vCPU / 16 GiB) is a reasonable starting point.
  instance_type: t3.xlarge

  # Root EBS volume size in GiB. 40 GiB is the default.
  # root_volume_size: 40

  # Pre-baked AMI IDs per region, populated automatically by `ai-desktops ami build`.
  # When present, desktop creation uses these AMIs instead of the default Ubuntu map,
  # and cloud-init skips package installation (tools are already baked in).
  # Run `ai-desktops ami list` to see current values.
  # active_ami:
  #   us-east-1: ami-0123456789abcdef0
  #   us-east-2: ami-0123456789abcdef1
  #   us-west-2: ami-0123456789abcdef2

  # Android Virtual Devices to create at desktop boot.
  # Each entry defines an AVD that avdmanager will create for the ubuntu user.
  # The AMI must have the Android SDK and the requested system-image pre-installed.
  # CLI flag --avd overrides this list entirely (it does not append).
  # avds:
  #   - name: flutter_dev
  #     image: "system-images;android-35;google_apis;x86_64"
  #     device: pixel_6   # optional hardware profile; omit for avdmanager default

  # CIDR range from which SSH (port 22) is allowed in the security group.
  # Defaults to 0.0.0.0/0 (open). Restrict to your IP for least-privilege access.
  operator_cidr: 0.0.0.0/0

agent:
  # Port where ai-agent-bridge listens on the desktop (localhost-only).
  # Default: 9445. Change only if there is a port conflict on the desktop.
  bridge_port: 9445

  # Whether to disable SSH host key verification when tunneling to desktops.
  # Leave false (the default) for normal operation so ~/.ssh/known_hosts is
  # consulted. Set to true when connecting to freshly provisioned desktops
  # whose host key is not yet in known_hosts; can also use --trust-host flag
  # on the agent command for one-shot overrides.
  # trust_host: false
