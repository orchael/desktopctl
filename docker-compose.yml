name: desktopctl-control-plane
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: desktopctl
      POSTGRES_USER: desktopctl_admin
      POSTGRES_PASSWORD: desktopctl_admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desktopctl_admin -d desktopctl"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - control-plane-postgres:/var/lib/postgresql/data
      - ./deploy/compose/postgres-init.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
  migrations:
    build: {context: ., dockerfile: Dockerfile.control-plane, target: web-dev}
    command: pnpm run db:migrate
    environment:
      DATABASE_URL: postgresql://desktopctl_admin:desktopctl_admin@postgres:5432/desktopctl
    depends_on:
      postgres: {condition: service_healthy}
  control-plane-api:
    build: {context: ., dockerfile: Dockerfile.control-plane, target: api}
    environment:
      DESKTOPCTL_CONFIG: ${DESKTOPCTL_CONFIG:-/app/config.example.yaml}
      DESKTOPCTL_ENVIRONMENT: ${DESKTOPCTL_ENVIRONMENT:-dev}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      OPERATOR_AWS_ACCESS_KEY_ID:
      OPERATOR_AWS_SECRET_ACCESS_KEY:
      OPERATOR_ROLE_ARN:
      OPERATOR_EXTERNAL_ID:
      CONTROL_PLANE_API_TOKEN:
      CONTROL_PLANE_MOCK_AWS: ${CONTROL_PLANE_MOCK_AWS:-true}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
  control-plane-web:
    build: {context: ., dockerfile: Dockerfile.control-plane, target: web}
    depends_on:
      migrations: {condition: service_completed_successfully}
      control-plane-api: {condition: service_healthy}
    environment:
      AUTH_SECRET: temporary-local-auth-secret-change-me
      AUTH_TRUST_HOST: "true"
      AUTH_URL: https://app.desktops.orchael.dev
      CONTROL_PLANE_API_TOKEN:
      CONTROL_PLANE_API_URL: http://control-plane-api:8080
      DATABASE_URL: postgresql://desktopctl_app:desktopctl_app@postgres:5432/desktopctl
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    depends_on:
      control-plane-web: {condition: service_started}
    environment:
      TLS_CERT_PEM: ${TLS_CERT_PEM:?TLS_CERT_PEM is required}
      TLS_KEY_PEM: ${TLS_KEY_PEM:?TLS_KEY_PEM is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/control-plane.nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  control-plane-postgres:
