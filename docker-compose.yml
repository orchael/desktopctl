name: desktopctl-control-plane-dev
services:
  control-plane-api:
    build: {context: ., dockerfile: Dockerfile.control-plane, target: api-dev}
    environment:
      DESKTOPCTL_CONFIG: /app/config.example.yaml
      CONTROL_PLANE_STANDALONE: "true"
      CONTROL_PLANE_API_TOKEN: dev-token
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
  control-plane-web:
    build: {context: ., dockerfile: Dockerfile.control-plane, target: web}
    depends_on:
      control-plane-api: {condition: service_healthy}
    environment:
      CONTROL_PLANE_API_TOKEN: dev-token
      CONTROL_PLANE_API_URL: http://control-plane-api:8080
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
